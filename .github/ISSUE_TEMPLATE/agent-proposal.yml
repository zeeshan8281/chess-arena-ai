name: Agent or strategy proposal
description: Propose a reproducible chess agent, prompt, or baseline.
title: "[Agent] "
body:
  - type: markdown
    attributes:
      value: "Proposals are reviewed before execution. Do not include API keys. See CONTRIBUTING.md."
  - type: textarea
    id: approach
    attributes:
      label: Agent and approach
      description: Model/version, exact prompt or code link, tools, legal-move access, and what changes.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and evidence
      description: Commands, dependency versions, PGN/JSON examples, test results, and seed policy.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation and budget
      description: Opponents, color pairs, games, inference limits, estimated cost, and failure handling.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Attribution, license, and limitations
    validations:
      required: true
